<svg viewBox="0 0 1100 680" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Courier New',monospace">
<defs>
  <radialGradient id="bg" cx="50%" cy="42%" r="80%">
    <stop offset="0%" stop-color="#0d0d0d"/><stop offset="70%" stop-color="#0a0a0a"/><stop offset="100%" stop-color="#000000"/>
  </radialGradient>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#f4f4f4"/></marker>
  <marker id="arc" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#9a9a9a"/></marker>
  <marker id="arm" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 L8 4.5 L0 9 Z" fill="#dcdcdc"/></marker>
</defs>
<rect width="1100" height="680" fill="url(#bg)"/>
<g stroke="#333333" stroke-width="0.8" fill="none"><rect x="22" y="22" width="1056" height="636"/></g>
<g stroke="#f4f4f4" stroke-width="1.1" fill="none">
  <path d="M22 42 L22 22 L42 22"/><path d="M1078 42 L1078 22 L1058 22"/>
  <path d="M22 638 L22 658 L42 658"/><path d="M1078 638 L1078 658 L1058 658"/>
</g>

<style>
  .t{fill:#f2f2f2}.m{fill:#8c8c8c}
  .box{fill:#0c0c0c;stroke:#4a4a4a;stroke-width:1.4}
  .title{font-family:'Space Grotesk',sans-serif;font-weight:600}
  .flow{stroke:#f4f4f4;stroke-width:2;fill:none}
  .lbl{font-size:12px;letter-spacing:1px}.sub{font-size:10.5px;fill:#9a9a9a}
  .cap{font-size:11px;fill:#8c8c8c}
</style>
<text x="40" y="52" class="title" font-size="15" letter-spacing="6" fill="#f4f4f4">TERRA LABS</text>
<line x1="40" y1="64" x2="128" y2="64" stroke="#f4f4f4" stroke-width="1"/>
<text x="40" y="92" class="title t" font-size="23" letter-spacing="1.5">INSIDE THE ENGINE / BAYESIAN STATE ESTIMATION</text>
<text x="1060" y="52" text-anchor="end" class="m" font-size="11" letter-spacing="2">FIG. 02 / INFERENCE</text>

<!-- recursion arc over the top -->
<path d="M250 168 C 250 128 900 128 900 168" fill="none" stroke="#f4f4f4" stroke-width="1.6" stroke-dasharray="5 5" marker-end="url(#ar)" opacity="0.8"/>
<text x="575" y="124" text-anchor="middle" class="cap" fill="#f4f4f4">recurse every cycle · the posterior becomes the next prior</text>

<!-- measurement input -->
<rect class="box" x="40" y="196" width="150" height="120" rx="2"/>
<text x="54" y="222" class="t" font-size="13">Measurement zₜ</text>
<text x="54" y="246" class="sub">noisy sensor read</text>
<text x="54" y="266" class="sub">may drift or drop</text>
<text x="54" y="292" class="sub" fill="#8c8c8c">one or many</text>
<text x="54" y="308" class="sub" fill="#8c8c8c">channels</text>

<!-- PREDICT -->
<rect class="box" x="230" y="180" width="200" height="152" rx="2"/>
<text x="244" y="206" class="title t" font-size="14">PREDICT</text>
<text x="244" y="232" class="sub">sigma points through the</text>
<text x="244" y="250" class="sub">system model f(x, u)</text>
<text x="244" y="274" class="sub">+ process noise Q</text>
<text x="244" y="292" class="sub">× band calibration (×3)</text>
<text x="244" y="316" class="sub" fill="#cfcfcf">→ predicted x⁻, P⁻</text>

<!-- UPDATE -->
<rect class="box" x="470" y="180" width="220" height="152" rx="2"/>
<text x="484" y="206" class="title t" font-size="14">UPDATE</text>
<text x="484" y="232" class="sub">innovation ν = zₜ − h(x⁻)</text>
<text x="484" y="250" class="sub">Kalman gain weights it</text>
<text x="484" y="274" class="sub" fill="#dcdcdc">NIS consistency gate</text>
<text x="484" y="292" class="sub" fill="#dcdcdc">sensor-bias correction</text>
<text x="484" y="316" class="sub" fill="#cfcfcf">→ posterior x⁺, P⁺</text>

<!-- POSTERIOR / hidden state inset -->
<rect class="box" x="730" y="180" width="330" height="152" rx="2"/>
<text x="744" y="206" class="title t" font-size="14">HIDDEN STATE + CREDIBLE BAND</text>
<text x="744" y="226" class="sub">what the sensors can't measure, with honest uncertainty</text>
<!-- mini chart -->
<g transform="translate(748,238)">
  <rect x="0" y="0" width="298" height="80" fill="#060606" stroke="#333333" stroke-width="1"/>
  <!-- credible band -->
  <path d="M6 30 L60 30 L120 34 L180 54 L240 66 L292 70 L292 84 L240 78 L180 66 L120 46 L60 42 L6 42 Z" fill="#f4f4f4" opacity="0.14"/>
  <!-- truth -->
  <polyline points="6,36 60,36 120,40 180,60 240,72 292,76" fill="none" stroke="#cfcfcf" stroke-width="1.4" stroke-dasharray="3 3"/>
  <!-- estimate -->
  <polyline points="6,36 60,36 120,38 180,56 240,70 292,74" fill="none" stroke="#f4f4f4" stroke-width="1.8"/>
  <text x="6" y="-4" class="sub" fill="#8c8c8c" font-size="9">efficiency 1.0</text>
  <line x1="0" y1="0" x2="0" y2="80" stroke="#333333"/><line x1="0" y1="80" x2="298" y2="80" stroke="#333333"/>
</g>
<text x="748" y="330" class="sub"><tspan fill="#f4f4f4">— estimate</tspan>   <tspan fill="#cfcfcf">- - truth</tspan>   <tspan fill="#8c8c8c">band = 95% credible</tspan></text>

<!-- flows across -->
<g class="flow" marker-end="url(#ar)">
  <path d="M190 250 L230 250"/>
  <path d="M430 256 L470 256"/>
  <path d="M690 256 L730 256"/>
</g>

<!-- downstream: forecast + cusum -->
<rect class="box" x="470" y="392" width="290" height="150" rx="2"/>
<text x="484" y="418" class="title t" font-size="14">FORECAST · Monte-Carlo horizon</text>
<text x="484" y="438" class="sub">propagate the posterior forward under the drive</text>
<g transform="translate(484,450)">
  <rect x="0" y="0" width="262" height="72" fill="#060606" stroke="#333333" stroke-width="1"/>
  <line x1="0" y1="20" x2="262" y2="20" stroke="#777777" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="200" y="15" class="sub" fill="#888888" font-size="9">safety limit</text>
  <polyline points="6,60 50,56 100,48 150,34 200,18 250,8" fill="none" stroke="#9a9a9a" stroke-width="1.8"/>
  <path d="M6 62 L50 58 L100 52 L150 40 L200 26 L250 16 L250 2 L200 10 L150 28 L100 44 L50 54 L6 58 Z" fill="#9a9a9a" opacity="0.12"/>
  <text x="150" y="68" text-anchor="middle" class="sub" fill="#8c8c8c" font-size="9">breach probability rises hours ahead</text>
</g>

<rect class="box" x="790" y="392" width="270" height="150" rx="2"/>
<text x="804" y="418" class="title t" font-size="14">SELF-CHECKS</text>
<text x="804" y="442" class="sub" fill="#dcdcdc">NIS · is the model still consistent</text>
<text x="804" y="462" class="sub" fill="#dcdcdc">with what the sensors report?</text>
<text x="804" y="490" class="sub" fill="#dcdcdc">CUSUM · abrupt regime-shift watch</text>
<text x="804" y="514" class="sub">when it stops matching reality, it</text>
<text x="804" y="532" class="sub">widens its bands and flags, not guesses</text>

<g class="flow" marker-end="url(#ar)"><path d="M615 332 L615 392"/></g>
<g marker-end="url(#arm)"><path d="M690 300 C 820 340 850 360 900 392" fill="none" stroke="#dcdcdc" stroke-width="1.6" stroke-dasharray="4 4"/></g>

<line x1="40" y1="580" x2="1060" y2="580" stroke="#4a4a4a" stroke-width="0.6" opacity="0.5"/>
<text x="40" y="610" class="cap">It infers what it cannot measure from cheap, drifting sensors, quantifies its own uncertainty, and forecasts the breach before it happens.</text>
<text x="40" y="646" class="title" font-size="12" letter-spacing="3" fill="#f4f4f4">KNOWS WHAT IT DOESN'T KNOW</text>
<text x="1060" y="646" text-anchor="end" class="cap">terralaboratories.com</text>
</svg>

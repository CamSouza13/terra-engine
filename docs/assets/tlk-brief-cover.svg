<text x="550" y="270" text-anchor="middle" class="title t" font-size="58" letter-spacing="4">SYSTEMS BRIEF</text>
<text x="550" y="308" text-anchor="middle" class="sub" font-size="14">Autonomous control for closed living systems</text>

<text x="550" y="360" text-anchor="middle" class="cap" font-size="12.5">One Bayesian engine reads the true state of a living loop from cheap, drifting sensors,</text>
<text x="550" y="380" text-anchor="middle" class="cap" font-size="12.5">forecasts failure hours ahead, and acts on it autonomously, on-site and offline.</text>


<text x="894" y="536" class="sub">it is the outcome-labeled</text>
<text x="894" y="554" class="sub">failure data only Terra</text>
<text x="894" y="572" class="sub" fill="#cfcfcf">accumulates in the field</text>

<line x1="40" y1="626" x2="1060" y2="626" stroke="#4a4a4a" stroke-width="0.6" opacity="0.5"/>
<text x="40" y="652" class="title" font-size="12" letter-spacing="3" fill="#f4f4f4">EVERY DEPLOYMENT MAKES THE NEXT ONE BETTER</text>
<text x="1060" y="652" text-anchor="end" class="cap">terralaboratories.com</text>

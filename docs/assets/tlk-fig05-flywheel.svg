  <path d="M300 250 A 210 210 0 0 1 470 178"/>
  <path d="M540 190 A 210 210 0 0 1 660 300"/>
  <path d="M680 380 A 210 210 0 0 1 620 520"/>
  <path d="M560 560 A 210 210 0 0 1 380 560"/>
  <path d="M300 520 A 210 210 0 0 1 262 360"/>
</g>

<!-- stage 1 top -->
<rect class="box" x="380" y="150" width="180" height="62" rx="2"/>

<text x="1060" y="52" text-anchor="end" class="m" font-size="11" letter-spacing="2">FIG. 05 / FLEET</text>

<!-- center hub -->
<circle cx="470" cy="392" r="86" fill="#0c0c0c" stroke="#cfcfcf" stroke-width="1.4" stroke-dasharray="4 5" opacity="0.9"/>

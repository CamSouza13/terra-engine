<text x="470" y="402" text-anchor="middle" class="title" font-size="15" fill="#cfcfcf">PRIOR</text>
<text x="470" y="424" text-anchor="middle" class="sub">the fleet's pooled</text>
<text x="470" y="440" text-anchor="middle" class="sub">knowledge</text>


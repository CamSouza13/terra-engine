<text x="184" y="374" text-anchor="middle" class="title t" font-size="13">DAY ONE</text>
<text x="184" y="392" text-anchor="middle" class="sub">accurate out of the box</text>

<!-- inset: prior tightening -->
<rect class="box" x="880" y="150" width="184" height="150" rx="2"/>
<text x="894" y="174" class="title t" font-size="12">POOLED-MEAN σ vs SITES</text>
<g transform="translate(898,190)">
  <rect x="0" y="0" width="150" height="86" fill="#060606" stroke="#333333" stroke-width="1"/>
  <polyline points="6,14 40,40 74,58 108,68 144,74" fill="none" stroke="#f4f4f4" stroke-width="2"/>
  <circle cx="6" cy="14" r="2.5" fill="#f4f4f4"/><circle cx="40" cy="40" r="2.5" fill="#f4f4f4"/>
  <circle cx="74" cy="58" r="2.5" fill="#f4f4f4"/><circle cx="108" cy="68" r="2.5" fill="#f4f4f4"/><circle cx="144" cy="74" r="2.5" fill="#f4f4f4"/>
</g>
<text x="898" y="294" class="sub" font-size="9.5">2 → N sites: tightens ~ τ / √N</text>

<!-- moat note -->
<rect class="box" x="880" y="470" width="184" height="120" rx="2"/>
<text x="894" y="496" class="title t" font-size="12">WHY IT COMPOUNDS</text>

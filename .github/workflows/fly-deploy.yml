# Manual-only. The project deploys via Vercel, not Fly. This workflow no longer
# runs on push (so it can't fail CI or send failure emails); run it by hand from
# the Actions tab only if you deliberately want a Fly deploy, and only after a
# FLY_API_TOKEN secret is configured and the Fly app has billing set up.

name: Fly Deploy
on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Skip when no Fly token is configured
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "FLY_API_TOKEN not set — skipping deploy. Add the secret to enable continuous deployment."

      - uses: actions/checkout@v4
        if: ${{ env.FLY_API_TOKEN != '' }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: ${{ env.FLY_API_TOKEN != '' }}
      - name: Deploy
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --remote-only
